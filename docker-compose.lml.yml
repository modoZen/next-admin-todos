version: "3"

services:
  todosDB:
    image: mysql:8.0
    container_name: todos-db
    ports:
      - 3306:3306
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=todos
      - MYSQL_USER=todos_user
      - MYSQL_PASSWORD=todos_password
    volumes:
      - ./mysql:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: todos-phpmyadmin
    ports:
      - 8080:80
    environment:
      - PMA_HOST=todosDB
      - PMA_USER=root
      - PMA_PASSWORD=root
    depends_on:
      - todosDB
